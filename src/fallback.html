<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #9a9a9a;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      .wrap {
        text-align: center;
        user-select: none;
      }
      .logo {
        width: 128px;
        height: 128px;
        border-radius: 18px;
        display: block;
        margin: 0 auto 26px;
        animation: tint 12s linear infinite;
      }
      @keyframes tint {
        from {
          filter: hue-rotate(0deg) saturate(1);
        }
        to {
          filter: hue-rotate(360deg) saturate(1);
        }
      }
      h1 {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: #bfbfbf;
        margin-bottom: 8px;
      }
      .sub {
        font-size: 12px;
        color: #6b6b6b;
        margin-bottom: 18px;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        min-height: 20px;
        color: #8a8a8a;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8ab4ff;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      .status.stalled .dot,
      .status.failed .dot {
        background: #e07060;
      }
      .actions {
        margin-top: 26px;
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      button {
        background: transparent;
        color: #cfcfcf;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 7px 20px;
        font-size: 13px;
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
      }
      button:hover {
        border-color: rgba(255, 255, 255, 0.45);
        color: #fff;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .cmd {
        margin-top: 20px;
        font-size: 11px;
        color: #4f4f4f;
        font-family: Consolas, monospace;
      }
      .log {
        margin: 8px auto 0;
        font-size: 11px;
        color: #3c3c3c;
        font-family: Consolas, monospace;
        max-width: 420px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .log:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="icon.png" alt="" />
      <h1>DSH DESKTOP</h1>
      <div class="sub" id="url">…</div>
      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">正在检测…</span>
      </div>
      <div class="actions">
        <button id="start">启动 DSH 服务</button>
        <button id="retry">重试</button>
      </div>
      <div class="cmd" id="cmd"></div>
      <div class="log" id="log"></div>
    </div>
    <script>
      const urlEl = document.getElementById('url');
      const cmdEl = document.getElementById('cmd');
      const statusEl = document.getElementById('status');
      const statusTextEl = document.getElementById('statusText');
      const startBtn = document.getElementById('start');
      const retryBtn = document.getElementById('retry');
      const logEl = document.getElementById('log');

      const b = window.dshDesktop.bootstrap;
      urlEl.textContent = b.serverUrl.replace(/^https?:\/\//, '');
      cmdEl.textContent = b.serverCommand;

      const STATUS_TEXT = {
        starting: '正在启动 DSH 服务…',
        waiting: '等待 DSH 服务…',
        failed: '启动失败，请重试',
        stalled: '启动超时，准备重试…',
        ok: '已就绪',
      };

      function setStatus(s) {
        statusEl.className = 'status' + (STATUS_TEXT[s] ? ' ' + s : '');
        statusTextEl.textContent = STATUS_TEXT[s] || STATUS_TEXT.waiting;
      }

      setStatus(b.serverStarting ? 'starting' : 'waiting');
      window.dshDesktop.onServerStatus((s) => setStatus(s));
      window.dshDesktop.onServerLog((line) => {
        if (line) logEl.textContent = line;
      });

      startBtn.addEventListener('click', () => {
        startBtn.disabled = true;
        setStatus('starting');
        window.dshDesktop.startServer();
        setTimeout(() => (startBtn.disabled = false), 1500);
      });

      retryBtn.addEventListener('click', () => {
        retryBtn.disabled = true;
        setStatus('waiting');
        window.dshDesktop.retry();
        setTimeout(() => (retryBtn.disabled = false), 1500);
      });
    </script>
  </body>
</html>
